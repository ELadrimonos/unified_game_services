name: unified_game_services_steam
resolution: workspace
description: Steam provider for unified_game_services, backed by the pure-Dart steamworks FFI bindings.
version: 0.1.0
repository: https://github.com/ELadrimonos/unified_game_services
homepage: https://gameservices.aprimo.dev
documentation: https://docs.gameservices.aprimo.dev/steam

topics:
  - game-services
  - achievements
  - leaderboards
  - steam
  - gamedev

# Steam runs on desktop only (Steamworks native lib + Steam client).
platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  ffi: ^2.1.4
  meta: ^1.15.0
  steamworks: ^0.4.10
  unified_game_services_platform_interface: ^0.1.0

dev_dependencies:
  archive: ^4.0.0
  args: ^2.6.0
  lints: ^6.0.0
  path: ^1.9.0
  steamworks_gen: ^0.4.5
  test: ^1.25.6
