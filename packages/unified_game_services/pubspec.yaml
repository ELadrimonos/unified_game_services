name: unified_game_services
resolution: workspace
description: Unified, multi-platform game services API for Dart (achievements, leaderboards, cloud save and more).
version: 0.2.0
repository: https://github.com/ELadrimonos/unified_game_services
homepage: https://gameservices.aprimo.dev
documentation: https://docs.gameservices.aprimo.dev

topics:
  - game-services
  - achievements
  - leaderboards
  - cloud-save
  - gamedev

# Pure-Dart facade — runs wherever the registered providers do.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  async: ^2.11.0
  unified_game_services_platform_interface: ^0.2.0

dev_dependencies:
  lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  test: ^1.25.6
  # For the cross-provider example only (not a runtime dependency of the facade).
  unified_game_services_epic: ^0.2.0
  unified_game_services_gamejolt: ^0.2.0
  unified_game_services_steam: ^0.2.0
