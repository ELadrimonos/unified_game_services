name: unified_game_services_epic
resolution: workspace
description: Epic Online Services (EOS) provider for unified_game_services, backed by the EOS C SDK via pure-Dart dart:ffi. Desktop only.
version: 0.2.0
repository: https://github.com/ELadrimonos/unified_game_services
homepage: https://gameservices.aprimo.dev
documentation: https://docs.gameservices.aprimo.dev/epic

topics:
  - game-services
  - achievements
  - leaderboards
  - epic-games
  - gamedev

# EOS C SDK ships shared libs for desktop; the host supplies the runtime lib.
platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.2.0
  unified_game_services_platform_interface: ^0.2.0

dev_dependencies:
  ffigen: ^22.0.0
  lints: ^6.0.0
  test: ^1.25.6
