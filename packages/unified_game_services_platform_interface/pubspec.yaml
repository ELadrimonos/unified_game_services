name: unified_game_services_platform_interface
resolution: workspace
description: Shared platform interface for unified_game_services — models, events, capabilities and the base contract every provider implements (pure Dart).
version: 0.1.0
repository: https://github.com/ELadrimonos/unified_game_services
homepage: https://gameservices.aprimo.dev
documentation: https://docs.gameservices.aprimo.dev/platform_interface

topics:
  - game-services
  - achievements
  - leaderboards
  - platform-interface
  - gamedev

# Pure Dart (models + contract only) — runs everywhere.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  dart_mappable: ^4.3.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  build_runner: ^2.4.13
  dart_mappable_builder: ^4.3.0
  lints: ^6.0.0
  test: ^1.25.6
